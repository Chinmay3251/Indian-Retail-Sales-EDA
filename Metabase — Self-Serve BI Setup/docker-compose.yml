services:
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_local_password
    ports: ["5433:5432"]
    volumes: ["warehouse_data:/var/lib/postgresql/data","./warehouse/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U analyst -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
  superset:
    image: apache/superset:latest
    depends_on:
      warehouse-db:
        condition: service_healthy
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: "local-demo-change-before-production"
    volumes: ["./superset/superset_config.py:/app/pythonpath/superset_config.py:ro"]
    command: >
      /bin/sh -c "superset db upgrade &&
      (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true) &&
      superset init && superset run -h 0.0.0.0 -p 8088"
volumes:
  warehouse_data:
